[project]
name = "inevi"
version = "0.1.0"
description = "AI-powered indoor spatial navigation - Where Google Maps ends, Inevi begins."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.36",
    "fastapi>=0.138.0",
    "groq>=0.37.1",
    "httpx>=0.28.1",
    "pillow>=12.2.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn>=0.49.0",
]

[tool.vercel]
entrypoint = "backend/main.py"